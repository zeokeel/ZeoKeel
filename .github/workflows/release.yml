name: release

# Release products (2026-11-01 replan):
#   personal edition   -> GitHub Releases: three-platform installers + latest.json (direct-to-app,
#                         no login; personal updates check this feed).
#   enterprise edition -> one docker image bundle (server + postgres + caddy) with the three
#                         enterprise client installers embedded in the server image at /srv/updates;
#                         customers deploy the bundle, then download clients from the server portal.
#
# Jobs run in parallel: desktop installers (personal + enterprise) and the enterprise image build.
# The personal GitHub Release is created as soon as the personal installers are ready; the
# enterprise image uploads itself into the same Release when its (slower) build finishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag v<version>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CHANNEL: official

jobs:
  version-check:
    name: tag == version gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve tag/version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$DISPATCH_TAG"; else TAG="$REF_NAME"; fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::release tag must look like v<version>, got '$TAG'"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          python3 - "$TAG" "$VERSION" <<'PY'
          import json, pathlib, sys
          tag, version = sys.argv[1], sys.argv[2]
          cargo = pathlib.Path("Cargo.toml").read_text()
          pkg = json.loads(pathlib.Path("package.json").read_text())
          tauri = json.loads(pathlib.Path("apps/desktop/tauri.conf.json").read_text())
          problems = []
          if f'version = "{version}"' not in cargo:
              problems.append("workspace Cargo.toml version != tag")
          if pkg.get("version") != version:
              problems.append("package.json version != tag")
          if tauri.get("version") != version:
              problems.append("tauri.conf.json version != tag")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print(f"version verified: {tag} -> {version}")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Reset previous release for this tag (fresh assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release delete "$TAG" --yes 2>/dev/null || true

  personal-installers:
    name: personal installers (${{ matrix.name }})
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04, targets: '["appimage","deb"]' }
          - { name: macos, os: macos-15, targets: '["dmg"]' }
          - { name: windows, os: windows-latest, targets: '["nsis"]' }
    uses: ./.github/workflows/build-desktop.yml
    with:
      edition: personal
      channel: official
      version: ${{ needs.version-check.outputs.version }}
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      targets: ${{ matrix.targets }}

  enterprise-clients:
    name: enterprise clients (${{ matrix.name }})
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04, targets: '["appimage","deb"]' }
          - { name: macos, os: macos-15, targets: '["dmg"]' }
          - { name: windows, os: windows-latest, targets: '["nsis"]' }
    uses: ./.github/workflows/build-desktop.yml
    with:
      edition: enterprise
      channel: official
      version: ${{ needs.version-check.outputs.version }}
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      targets: ${{ matrix.targets }}

  personal-release:
    name: personal GitHub Release
    needs: [version-check, personal-installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version-check.outputs.tag }}
      VERSION: ${{ needs.version-check.outputs.version }}
      CHANNEL: official
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVER_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          python: "true"
      - uses: actions/download-artifact@v8
        with:
          pattern: clients-personal-*
          path: personal-clients
          merge-multiple: true
      - name: Assemble personal dist (installers + latest.json + SHA256SUMS + SBOM)
        run: |
          set -euo pipefail
          mkdir -p dist/clients dist/sbom
          cp personal-clients/* dist/clients/
          cargo run -q -p zk -- sbom --edition personal --profile default --channel official \
            --output dist/sbom/cyclonedx.json
          cp KNOWN-LIMITATIONS.md dist/KNOWN-LIMITATIONS.md
          printf '%s\n' "$VERSION" > dist/VERSION
          python3 - "$TAG" "$VERSION" <<'PY'
          import hashlib, json, pathlib, sys
          tag, version = sys.argv[1:3]
          dist = pathlib.Path("dist")
          clients = sorted((dist / "clients").iterdir())
          if not clients:
              raise SystemExit("no personal installers downloaded")
          def sha256(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          def platform(name: str) -> str | None:
              lower = name.lower()
              if lower.endswith(".appimage"):
                  return "linux-x86_64"
              if lower.endswith(".dmg"):
                  return "macos-aarch64"
              if lower.endswith(".exe") or lower.endswith(".msi"):
                  return "windows-x86_64"
              return None
          base = f"https://github.com/zeokeel/ZeoKeel/releases/download/{tag}"
          assets = []
          for path in clients:
              platform_key = platform(path.name)
              if platform_key is None:
                  continue
              assets.append({
                  "platform": platform_key,
                  "url": f"{base}/{path.name}",
                  "sha256": sha256(path),
              })
          if not assets:
              raise SystemExit("no platform-mapped personal installer")
          pathlib.Path(dist / "latest.json").write_text(json.dumps({
              "version": version,
              "notes": "ZeoKeel personal edition (direct-to-app, no server login).",
              "assets": assets,
          }, indent=2) + "\n")
          sums = []
          for path in sorted(dist.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  sums.append(f"{sha256(path)}  {path.relative_to(dist).as_posix()}")
          (dist / "SHA256SUMS").write_text("\n".join(sums) + "\n")
          print(f"personal assets: {[a['platform'] for a in assets]}")
          PY
      - name: Generate release body
        run: |
          set -euo pipefail
          python3 - "$TAG" "$VERSION" "$SERVER_URL" <<'PY'
          import pathlib, re, sys
          tag, version, run_url = sys.argv[1:4]
          text = pathlib.Path("CHANGELOG.md").read_text().splitlines()
          changelog = []
          start = False
          for line in text:
              if re.match(rf"^#+\s*\[?{re.escape(version)}\]?", line):
                  start = True
                  changelog.append(line)
                  continue
              if start and re.match(r"^##\s", line):
                  break
              if start:
                  changelog.append(line)
          body = [
              f"# {tag}",
              "",
              "## Personal edition (GitHub Releases)",
              "",
              "- **Direct to the app, no server/login.** Three-platform installers are attached;",
              "  `latest.json` is the personal update feed and `SHA256SUMS` covers every published asset.",
              "- Windows installers are unsigned by decision (ADR-033: SHA256 only). macOS dmg is built on arm64 and is not notarized (ADR-037).",
              "",
              "## Enterprise edition (docker image bundle)",
              "",
              f"- Asset `zeokeel-enterprise-{version}-official.tar.gz` contains the server + postgres + caddy images.",
              "  The server image embeds the three enterprise client installers at `/srv/updates`; deploy the bundle,",
              "  then download the enterprise client from the deployed server portal (`/portal`) and log in.",
              "- Enterprise clients are NOT the GitHub Release installers above: use the ones served by your server.",
              "",
              "## Changelog",
              "",
          ]
          body += changelog if changelog else [f"_No CHANGELOG.md section for {version}; treat as UNVERIFIED._"]
          body += [
              "",
              "## UNVERIFIED / known limitations",
              "",
              "- macOS notarization/staple: certificate-gated (ADR-037), not executed.",
              "- Windows real-machine install: manual acceptance item.",
              "- Docker bundle upgrade/rollback drill, PITR/WAL, real provider/media calls, 500-user production capacity: UNVERIFIED (see KNOWN-LIMITATIONS.md §2).",
              "- `latest.json` is generated for the personal feed; GitHub `releases/latest` ignores prereleases, so rc builds are not offered as automatic updates yet.",
              f"- Pipeline run: {run_url}",
          ]
          pathlib.Path("release-body.md").write_text("\n".join(body) + "\n")
          PY
      - name: Create or update the GitHub Release (personal assets)
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find dist/clients -type f; printf '%s\n' dist/latest.json dist/SHA256SUMS dist/sbom/cyclonedx.json dist/KNOWN-LIMITATIONS.md dist/VERSION)
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-body.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file release-body.md $PRERELEASE
          fi
          gh release view "$TAG" --json assets,url > release.json
          python3 - release.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          names = {asset["name"] for asset in data["assets"]}
          required = {"latest.json", "SHA256SUMS"}
          clients = {name for name in names if name.endswith((".AppImage", ".deb", ".dmg", ".exe", ".msi"))}
          if not required <= names or len(clients) < 2:
              raise SystemExit(f"release incomplete: assets={sorted(names)}")
          print(f"personal release verified: {len(clients)} installers, {data['url']}")
          PY

  enterprise-image:
    name: enterprise image bundle
    needs: [version-check, enterprise-clients]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version-check.outputs.tag }}
      VERSION: ${{ needs.version-check.outputs.version }}
      CHANNEL: official
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: clients-enterprise-*
          path: enterprise-clients
          merge-multiple: true
      - name: Embed enterprise clients into the image update dir
        run: |
          set -euo pipefail
          mkdir -p deploy/enterprise-updates/clients
          cp enterprise-clients/* deploy/enterprise-updates/clients/
          python3 - "$VERSION" <<'PY'
          import hashlib, json, pathlib, sys
          version = sys.argv[1]
          installer_suffixes = {".appimage", ".deb", ".rpm", ".dmg", ".exe", ".msi"}
          clients = [
              path
              for path in sorted(pathlib.Path("deploy/enterprise-updates/clients").iterdir())
              if path.is_file() and path.suffix.lower() in installer_suffixes
          ]
          if len(clients) < 3:
              raise SystemExit(f"expected three enterprise client installers, got {[c.name for c in clients]}")
          assets = []
          for path in clients:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({"name": path.name, "sha256": digest, "size": path.stat().st_size})
          release = {
              "schema": 1,
              "channel_id": "official",
              "edition": "enterprise",
              "server_version": version,
              "client_version": version,
              "min_supported": version,
              "forced": False,
              "assets": assets,
          }
          pathlib.Path("deploy/enterprise-updates/CLIENT-RELEASE.json").write_text(json.dumps(release, indent=2) + "\n")
          pathlib.Path("deploy/enterprise-updates/CHANNEL.json").write_text(json.dumps({
              "channel": "official", "product_name": "ZeoKeel", "powered_by": "show"
          }, indent=2) + "\n")
          print(f"embedded clients: {[asset['name'] for asset in assets]}")
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Build enterprise server image (with embedded clients)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          push: false
          load: true
          tags: zeokeel/server:${{ env.VERSION }}-official
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ZEOKEEL_EDITION=enterprise
            ZEOKEEL_PROFILE=default
            ZEOKEEL_CHANNEL=official
      - name: Export enterprise image bundle (server + postgres + caddy)
        run: |
          set -euo pipefail
          docker pull postgres:18-alpine
          docker pull caddy:2.8-alpine
          BUNDLE="zeokeel-enterprise-$VERSION-official.tar.gz"
          docker save "zeokeel/server:$VERSION-official" postgres:18-alpine caddy:2.8-alpine | gzip > "$BUNDLE"
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          ls -lh "$BUNDLE"
      - uses: actions/upload-artifact@v7
        with:
          name: enterprise-image-bundle
          path: zeokeel-enterprise-*.tar.gz*
          if-no-files-found: error
      - name: Attach the enterprise bundle to the GitHub Release
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::personal release did not appear; cannot attach enterprise bundle"; exit 1
          fi
          gh release upload "$TAG" "zeokeel-enterprise-$VERSION-official.tar.gz" "zeokeel-enterprise-$VERSION-official.tar.gz.sha256" --clobber
