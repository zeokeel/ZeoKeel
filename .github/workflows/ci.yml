name: ci

# Gate truth (no false-green): every command claimed as a current gate in
# docs/18-strictness.md / AGENTS.md §6 runs in ci.yml, security.yml or release.yml.
#
# Triggers are intentionally narrow to avoid burning runners on duplicate runs:
#   - push to main only (feature branches are validated by their PR)
#   - pull requests targeting main
#   - tag pushes are handled by release.yml alone (no triplicate ci/security runs)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          system-deps: "true"
          rust: "true"
          rust-components: rustfmt, clippy
          pnpm: "true"
          node: "true"
          node-cache: pnpm
      # zk-desktop's tauri::generate_context! embeds web/dist; fmt/clippy/test
      # compile the bin, so the web bundle must exist before the Rust gates.
      - name: Build desktop web dist (Tauri frontendDist prerequisite)
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/desktop/web build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Baseline manifest + generation gates
        run: |
          cargo run -q -p zk -- validate
          cargo run -q -p zk -- compose --edition personal --profile default --channel official --check
          cargo run -q -p zk -- capability --check
          cargo run -q -p zk -- lint --duplicates
          cargo run -q -p zk -- docs --check
          cargo run -q -p zk -- db lock --check
          python3 scripts/agent-tool-matrix.py --check
          python3 scripts/docs-command-check.py --self-test && python3 scripts/docs-command-check.py
      - name: Generated schemas stable
        run: |
          cargo test --workspace export_schema
          git diff --exit-code
          bash scripts/schema-check.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # cargo nextest is not installed locally/CI; `cargo test` is the executed runner
      # and docs/18 records nextest as UNVERIFIED (no false claim).
      - name: Test (cargo test)
        run: cargo test --workspace
      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps
      - name: Enterprise composition (client + server wiring)
        run: |
          cargo run -q -p zk -- compose --edition enterprise --profile default --channel official
          cargo check -p zk-server -p zk-desktop -p zk-composed

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          pnpm: "true"
          node: "true"
          node-cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all web packages, tsc -b)
        run: pnpm -r typecheck
      - name: Lint (all web packages, eslint --max-warnings 0)
        run: pnpm -r lint
      - name: Unit tests (all web packages, vitest)
        run: pnpm -r test:unit
      - name: Build all web packages (personal baseline)
        run: pnpm -r build
      - name: Enterprise UI (admin SPA + enterprise client registry)
        run: |
          cargo run -q -p zk -- compose --edition enterprise --profile default --channel official
          pnpm -r build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          go: "true"
      - name: Local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "SELECT version();"
      # A18 target trimming: the committed baseline is personal (targets = desktop) and
      # generates a stub apps/server; server jobs compose enterprise first.
      - name: "Enterprise composition (A18): personal baseline generates a stub server"
        run: cargo run -q -p zk -- compose --edition enterprise --profile default --channel official
      - name: Build server (enterprise composition)
        run: cargo build -p zk-server
      - name: Assert zk-server is the enterprise build, not the A18 stub
        run: |
          set -euo pipefail
          cargo tree -p zk-server --edges normal | grep -q 'zk-srv-http'
          if strings target/debug/zk-server \
              | grep -qF 'server target is not part of the personal composition'; then
            echo "::error::stub zk-server binary: enterprise composition missing (A18)" >&2
            exit 1
          fi
          echo "zk-server is the enterprise build (srv deps present, A18 stub marker absent)"
      - name: Server integration (real PG, auth/billing/audit)
        run: bash scripts/srv-auth-test.sh
      - name: "Updates e2e (real PG): manifest/channel-reject/version-reject/artifact/portal"
        run: bash scripts/updates-e2e.sh
      - name: Build wasm guest (wasip1, required by apps e2e)
        run: |
          (cd experiments/wasm-poc/guest-go && \
            GOOS=wasip1 GOARCH=wasm go build -ldflags="-s -w" -o guest-go.wasm .)
      - name: Apps e2e (real PG + real wasm app lifecycle)
        run: bash scripts/apps-e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-evidence
          path: |
            target/evidence/m4
            target/evidence/m6
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          system-deps: "true"
          rust: "true"
          pnpm: "true"
          node: "true"
          node-cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Client e2e (M0/M1, serve carrier, axe in m1-mock/m1-workspace-ui)
        run: bash scripts/m1-e2e.sh
      - name: Agent rig e2e (fake upstream)
        run: bash scripts/agent-e2e.sh
      - name: Schedule executor auto-run e2e
        run: bash e2e/serve-schedule.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidence
          path: target/evidence
          if-no-files-found: ignore

  a11y:
    # Real axe matrix executed by the enterprise e2e scripts:
    #   scripts/login-e2e.sh -> m2-login/m3-client-content/m4-client-apps (AxeBuilder)
    #   scripts/admin-e2e.sh -> m6-a11y/m5-portal (AxeBuilder)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          system-deps: "true"
          rust: "true"
          pnpm: "true"
          node: "true"
          node-cache: pnpm
          go: "true"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "SELECT version();"
      - name: Build wasm guest (login e2e seeds an approved app)
        run: |
          (cd experiments/wasm-poc/guest-go && \
            GOOS=wasip1 GOARCH=wasm go build -ldflags="-s -w" -o guest-go.wasm .)
      - name: Client a11y (first-run/login/chat/content/apps axe, serious/critical = 0)
        run: bash scripts/login-e2e.sh
      - name: Admin + portal a11y (admin pages + portal axe, serious/critical = 0)
        run: bash scripts/admin-e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-evidence
          path: |
            target/evidence/m2
            target/evidence/m3
            target/evidence/m6
            target/evidence/round6
          if-no-files-found: ignore

  e2e-oem:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: OEM/delivery e2e (channel schema, index/pin, compose matrix, dist verify)
        run: bash scripts/oem-e2e.sh

  e2e-client-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          system-deps: "true"
          rust: "true"
          pnpm: "true"
          node: "true"
          node-cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "SELECT version();"
      - name: Forced client upgrade e2e (real server 426 + non-dismissable UpgradeGate)
        run: bash scripts/client-upgrade-e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-upgrade-evidence
          path: target/evidence/client-upgrade
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - run: python3 scripts/docs-check.py
      - run: python3 scripts/spec-check.py
      - run: python3 scripts/review-check.py
      - run: bash scripts/schema-check.sh

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: Validate compose
        env:
          DOMAIN: zeokeel.example.com
          TLS_MODE: auto
          ADMIN_PASSWORD: ci-admin-password
          PG_PASSWORD: ci-pg-password
          SERVER_IMAGE: zeokeel/server:ci
          MASTER_KEY: ci-master-key
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: Build server image
        run: docker build -f deploy/docker/Dockerfile.server -t zeokeel/server:ci .
      - name: SBOM (CycloneDX, offline)
        run: |
          cargo run -q -p zk -- sbom --edition enterprise --profile default --channel official --output target/evidence/sbom/zeokeel-enterprise.cdx.json
          cargo run -q -p zk -- sbom --edition enterprise --profile default --channel official --output target/evidence/sbom/zeokeel-enterprise.cdx.json --check
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: target/evidence/sbom/
