name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Tauri + icon renderer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-bin xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Baseline manifest + generation gates
        run: |
          cargo run -q -p zk -- validate
          cargo run -q -p zk -- compose --edition personal --profile default --channel official --check
          cargo run -q -p zk -- capability --check
          cargo run -q -p zk -- lint --duplicates
          cargo run -q -p zk -- docs --check
          cargo run -q -p zk -- db lock --check
          python3 scripts/agent-tool-matrix.py --check
          python3 scripts/docs-command-check.py
      - name: Generated schemas stable
        run: |
          cargo test --workspace export_schema
          git diff --exit-code
          bash scripts/schema-check.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Enterprise composition (client + server wiring)
        run: |
          cargo run -q -p zk -- compose --edition enterprise --profile default --channel official
          cargo check -p zk-server -p zk-desktop -p zk-composed
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: "12.16.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Personal baseline UI
        run: |
          pnpm --dir apps/desktop/web build
          pnpm --dir apps/desktop/web test
      - name: Enterprise UI (admin SPA + enterprise client registry)
        run: |
          cargo run -q -p zk -- compose --edition enterprise --profile default --channel official
          pnpm --dir apps/desktop/web build
          pnpm --dir apps/admin/web build
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "SELECT version();"
      - name: Build server
        run: cargo build -p zk-server
      - name: Server integration (real PG, auth/billing/audit)
        run: bash scripts/srv-auth-test.sh

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Tauri + icon renderer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-bin xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: "12.16.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/m1-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-e2e-evidence
          path: target/evidence/m1
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/docs-check.py
      - run: python3 scripts/spec-check.py
      - run: python3 scripts/review-check.py
      - run: bash scripts/schema-check.sh

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate compose
        env:
          DOMAIN: zeokeel.example.com
          TLS_MODE: auto
          ADMIN_PASSWORD: ci-admin-password
          PG_PASSWORD: ci-pg-password
          SERVER_IMAGE: zeokeel/server:ci
          MASTER_KEY: ci-master-key
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: Build server image
        run: docker build -f deploy/docker/Dockerfile.server -t zeokeel/server:ci .
      - name: SBOM (CycloneDX, offline)
        run: |
          cargo run -q -p zk -- sbom --edition enterprise --profile default --channel official --output target/evidence/sbom/zeokeel-enterprise.cdx.json
          cargo run -q -p zk -- sbom --edition enterprise --profile default --channel official --output target/evidence/sbom/zeokeel-enterprise.cdx.json --check
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/evidence/sbom/
