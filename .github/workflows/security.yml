name: security
on: [push, pull_request]
jobs:
  hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          cargo install cargo-geiger --version 0.14.0 --locked
      - run: cargo deny check
      - run: cargo audit
      - run: cargo machete
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm audit --prod
      - run: ZEOKEEL_SECURITY_STRICT=1 bash scripts/security-audit.sh
  a11y:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "axe matrix runs via scripts/admin-e2e.sh + login-e2e.sh in CI with PG"
