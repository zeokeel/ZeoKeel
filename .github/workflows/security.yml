name: security

# Supply-chain + strict security audit (docs/18 §7, docs/21 §10, docs/33).
#
# The strict job must never be red for *missing prerequisites* (threat-model review
# P1-4). Everything gates 1/2/3/4/5a/8/10/11/12/13 can execute against is provisioned
# below: real PostgreSQL, prebuilt zk-server/zk-desktop, a warm cargo registry for the
# audit's `cargo test --offline` invocations, cargo-deny/audit/machete/geiger, pnpm audit,
# a real server image and a pinned trivy image scan whose JSON report is handed to the
# audit via ZEOKEEL_SECURITY_TRIVY_REPORT.
#
# Environment-only gates (WORM anchoring = deployment control, ADR-068; artifact-level
# SBOMs = release-only; trivy gate without a report) are reported by
# scripts/security-audit.sh as `unverified_external` + `env_only: true` and are ignored by
# strict mode.
#
# ZEOKEEL_SECURITY_KNOWN_GAPS is intentionally empty: the former rc.1 known gap gate 5b /
# "mcp-stdio-transport" (audit JSON id 14) is CLOSED — B16 landed and gate 14 now passes
# (`cargo test -p zk-connector-mcp`). The wrapper below is kept only as a regression
# guard: if a future documented gap must be tolerated it must be added here AND in
# docs/18 §7.2 + KNOWN-LIMITATIONS.md with an ADR; otherwise any `fail` stays strict-red.
#
# The real a11y gate lives in ci.yml `a11y` (it executes the axe specs via the enterprise
# e2e scripts); the previous echo-only a11y job is deleted so no job can claim a gate it
# does not execute (R2, no false-green).
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZEOKEEL_SECURITY_STRICT: "1"
  ZEOKEEL_SECURITY_RC_SUMMARY: target/evidence/release-1.0-rc1/security
  # security.yml prebuilds the binaries and the image, so the audit must not rebuild.
  ZEOKEEL_SECURITY_SKIP_BUILD: "1"
  ZEOKEEL_SECURITY_IMAGE: zeokeel/server:security-${{ github.sha }}
  ZEOKEEL_SECURITY_TRIVY_REPORT: target/evidence/security/trivy-image.json
  # Empty by design: gate 14 (mcp-stdio-transport) now passes (B16 landed). A non-empty
  # entry must be documented in docs/18 §7.2 + KNOWN-LIMITATIONS.md and backed by an ADR.
  ZEOKEEL_SECURITY_KNOWN_GAPS: ""

jobs:
  hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # gates 2/3/7 (srv-auth-test, SSRF probe, audit-chain markers) need a real PG; the
      # repository scripts use local peer auth via `sudo -u postgres`. Tauri system libs
      # are needed to build/run zk-desktop for the rebinding probe (gate 3).
      - name: System deps + local PostgreSQL (prerequisites for gates 2/3/7)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-bin xvfb
          sudo systemctl start postgresql
          sudo -u postgres psql -c "SELECT version();"
      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          cargo install cargo-geiger --version 0.14.0 --locked
      # The audit script runs `cargo test --offline` for gates 4/5/12; fetch once with
      # network first so a cold GitHub runner still has the registry cache those need.
      - name: Fetch locked dependencies (needed by the audit's --offline tests)
        run: cargo fetch --locked
      # gates 2/3/7/12 need runnable binaries; ZEOKEEL_SECURITY_SKIP_BUILD=1 keeps the
      # audit from rebuilding them (single build here).
      - name: Build audit binaries (zk-server + zk-desktop; gates 3/7/12 prerequisites)
        run: cargo build -p zk-server -p zk-desktop
      - name: cargo-deny (license/advisory/ban/source)
        run: cargo deny check
      - name: cargo-audit (RUSTSEC advisories)
        run: cargo audit
      - name: cargo-machete (unused dependencies)
        run: cargo machete
      # cargo-geiger is NOT just installed: it really runs and its report is kept as
      # evidence (docs/18 §7 used to claim geiger while never invoking it).
      - name: cargo-geiger (unsafe usage statistics for the dependency tree)
        run: |
          mkdir -p target/evidence/security
          cargo geiger --all-features | tee target/evidence/security/cargo-geiger.txt
      - uses: pnpm/action-setup@v4
        with: { version: "12.16.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - name: pnpm audit (production dependencies)
        run: pnpm install --frozen-lockfile && pnpm audit --prod
      # gate 10 prerequisite: a real server image plus a pinned trivy scan. BuildKit's
      # GHA cache keeps the release build from being recomputed from scratch each run.
      - uses: docker/setup-buildx-action@v3
      - name: Build server image (gate 10 prerequisite)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          tags: ${{ env.ZEOKEEL_SECURITY_IMAGE }}
          load: true
          cache-from: type=gha,scope=security-server-image
          cache-to: type=gha,mode=max,scope=security-server-image
      - name: Record server image id (gate 10 evidence)
        run: |
          mkdir -p target/evidence/security
          docker image inspect "$ZEOKEEL_SECURITY_IMAGE" --format '{{.Id}} {{.Size}}' \
            | tee target/evidence/security/server-image.txt
      - name: Install pinned trivy
        env:
          TRIVY_VERSION: "0.76.1"
        run: |
          set -euo pipefail
          mkdir -p target/evidence/security
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o "$RUNNER_TEMP/trivy.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C /usr/local/bin trivy
          trivy --version | tee target/evidence/security/trivy-version.txt
      - name: Trivy image scan (gate 10 evidence; JSON handed to the audit)
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ZEOKEEL_SECURITY_TRIVY_REPORT")"
          trivy image --scanners vuln --format json \
            --output "$ZEOKEEL_SECURITY_TRIVY_REPORT" "$ZEOKEEL_SECURITY_IMAGE"
          python3 - "$ZEOKEEL_SECURITY_TRIVY_REPORT" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          results = data.get("Results") or []
          rows = [vuln for result in results for vuln in (result.get("Vulnerabilities") or [])]
          severe = [vuln for vuln in rows if vuln.get("Severity") in {"HIGH", "CRITICAL"}]
          print(f"trivy: {len(results)} target(s), {len(rows)} vulnerability row(s), {len(severe)} HIGH/CRITICAL")
          if not results:
              raise SystemExit("trivy report has no Results — the image scan did not run correctly")
          # Collection must succeed; gate 10 in scripts/security-audit.sh owns the
          # pass/fail policy for the report (0 HIGH/CRITICAL).
          PY
      - name: Strict security audit (prerequisites provided above)
        id: audit
        env:
          ZEOKEEL_SECURITY_STRICT: "1"
          ZEOKEEL_SECURITY_SKIP_BUILD: "1"
          ZEOKEEL_SECURITY_IMAGE: ${{ env.ZEOKEEL_SECURITY_IMAGE }}
          ZEOKEEL_SECURITY_TRIVY_REPORT: ${{ env.ZEOKEEL_SECURITY_TRIVY_REPORT }}
          ZEOKEEL_SECURITY_RC_SUMMARY: ${{ env.ZEOKEEL_SECURITY_RC_SUMMARY }}
          ZEOKEEL_SECURITY_KNOWN_GAPS: ${{ env.ZEOKEEL_SECURITY_KNOWN_GAPS }}
        run: |
          set -uo pipefail
          set +e
          bash scripts/security-audit.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "security-audit: strict exit 0"
            exit 0
          fi
          # Known product gaps (explicit allowlist, documented in docs/18 §7.2 and
          # KNOWN-LIMITATIONS.md) must not keep the required CI job permanently red.
          # Everything else — any real `fail`, or any CI-satisfiable `unverified` — stays red.
          python3 - "$rc" "${ZEOKEEL_SECURITY_KNOWN_GAPS:-}" \
            "${ZEOKEEL_SECURITY_RC_SUMMARY}/security.json" <<'PY'
          import json
          import sys

          rc = int(sys.argv[1])
          known = {item.strip() for item in sys.argv[2].split(",") if item.strip()}
          path = sys.argv[3]
          try:
              payload = json.load(open(path, encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              print(f"::error::security-audit exited {rc} and its evidence JSON is unreadable ({error})")
              sys.exit(rc or 1)
          gates = payload.get("gates") or []
          # Allowlist entries may be audit ids (e.g. "14") or rule names
          # (e.g. "mcp-stdio-transport"); both are matched so an id split/rename cannot
          # silently turn a known gap into a false red (or vice versa).
          failing = [gate for gate in gates if gate.get("status") == "fail"]
          fail_ids = {str(gate.get("id")) for gate in failing}
          fail_rules = {str(gate.get("rule")) for gate in failing}
          unmatched = [
              gate
              for gate in failing
              if str(gate.get("id")) not in known and str(gate.get("rule")) not in known
          ]
          unexpected = sorted(str(gate.get("id")) for gate in unmatched)
          ci_unverified = {
              str(gate.get("id"))
              for gate in gates
              if str(gate.get("status", "")).startswith("unverified") and not gate.get("env_only")
          }
          print(f"security-audit: rc={rc} overall={payload.get('overall')} "
                f"fail={sorted(fail_ids)} ci_unverified={sorted(ci_unverified)}")
          # Green only when every strict failure is an explicitly documented known gap
          # AND no CI-satisfiable gate is still unverified. Anything else keeps the
          # audit's non-zero exit (no blanket `|| true`).
          if failing and not unexpected and not ci_unverified:
              print(f"::warning::security-audit strict exit {rc} is only for documented known gap(s) "
                    f"{sorted(fail_ids)}; overall={payload.get('overall')} recorded in evidence "
                    f"(docs/18 §7.2, KNOWN-LIMITATIONS.md)")
              sys.exit(0)
          print(f"::error::security-audit strict failed: unexpected fail={unexpected} "
                f"ci_unverified={sorted(ci_unverified)}")
          sys.exit(rc)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: |
            target/evidence/security
            target/evidence/m6/security
            target/evidence/release-1.0-rc1/security
            target/evidence/release-1.0-rc1/security2
          if-no-files-found: ignore
