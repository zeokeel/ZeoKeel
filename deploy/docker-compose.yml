name: zeokeel
# Single-node enterprise topology (docs/09 §5, docs/20 §2).
# Ports: only caddy publishes 80/443; server is internal on 8787 (docs/20 §2 uses 8080
# historically — the server binary binds 8787, this compose follows the code).
services:
  postgres:
    # docs/09 §5 pins the major (18) and requires a digest at delivery time.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeokeel
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required (deploy/.env)}
      POSTGRES_DB: zeokeel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeokeel -d zeokeel"]
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required (zeokeel/server:<ver>-<channel>)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZEOKEEL_DATABASE_URL: postgres://zeokeel:${PG_PASSWORD}@postgres:5432/zeokeel
      ZEOKEEL_SERVER_ADDR: 0.0.0.0:8787
      ZEOKEEL_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ZEOKEEL_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (deploy/.env)}
      # docs/06 §5 lists MASTER_KEY among the six required .env keys; keep it required
      # here so a deployment cannot silently run without the key it will encrypt with.
      ZEOKEEL_MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required (docs/06 §5)}
      ZEOKEEL_COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Client installers are embedded in the image (/srv/updates); override UPDATE_DIR to
      # serve a host-mounted directory instead (docs/09 §5, deploy/enterprise-updates/README.md).
      ZEOKEEL_UPDATE_DIR: ${UPDATE_DIR:-/srv/updates}
      ZEOKEEL_APP_DB_DIR: /data/app-db
      ZEOKEEL_AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      ZEOKEEL_USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-365}
      ZEOKEEL_MONTHLY_GRANT_MICROS: ${MONTHLY_GRANT_MICROS:-0}
      ZEOKEEL_MONTHLY_GRANT_MODE: ${MONTHLY_GRANT_MODE:-accumulate}
      ZEOKEEL_UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      ZEOKEEL_UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      ZEOKEEL_ADMIN_DIST: /srv/admin
    volumes:
      - ./data:/data
    expose: ["8787"]
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required (deploy/.env)}
      TLS_MODE: "${TLS_MODE:?TLS_MODE is required: auto|manual|internal (docs/09 §5)}"
    # Picks Caddyfile.auto|manual|internal from TLS_MODE (three Caddyfiles, docs/09 §5).
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./portal:/srv/portal:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin API is localhost:2019; busybox wget ships with the image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
