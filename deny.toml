# cargo-deny policy (CI: .github/workflows/security.yml).
# Project license: MIT. Dependencies must be permissively licensed; copyleft
# (GPL/AGPL/LGPL) is not allowed because shipped binaries would inherit it.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "all"
unsound = "all"
# Transitive "unmaintained" advisories from the desktop keychain stack
# (keyring -> secret-service -> zbus -> zvariant/zvariant_derive 5.x). cargo-deny
# reports "no safe upgrade"; keyring 4 is the maintained API and the crates are
# not exposed to untrusted input. Re-evaluate on the next keyring/zbus upgrade.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0372"]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # GPL-3.0: incompatible with MIT-only distribution of shipped binaries.
  { crate = "epub", reason = "GPL-3.0; use tool-read-document loaders instead" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
