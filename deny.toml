# cargo-deny policy (CI: .github/workflows/security.yml).
# Project license: MIT. Dependencies must be permissively licensed; copyleft
# (GPL/AGPL/LGPL) is not allowed because shipped binaries would inherit it.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
# RC.1 policy: block vulnerabilities; surface unmaintained/unsound transitive crates
# as warnings (wasmtime 50 / Tauri 2.7 / keyring 4 pin sets offer no safe upgrade).
# Ignored vulnerability advisories below affect APIs this codebase does not use;
# each has a narrow, documented rationale and a post-RC upgrade path.
# Pinned cargo-deny 0.20.2 has no "warn" severity for these categories
# (accepted values: all/workspace/transitive/none), so they are disabled here and
# tracked in KNOWN-LIMITATIONS §4; vulnerabilities remain denied (ignore list has
# narrow, documented exceptions). Re-enable after upgrading cargo-deny post-RC.
unmaintained = "none"
unsound = "none"
ignore = [
  # zip 4.6: affected APIs are ZipArchive::extract / ZipStreamReader::extract.
  # zk-* never calls extract(); it iterates by_index + enclosed_name and rejects
  # hostile entries explicitly (gate 4 + zk-kit-tools hostile-entry tests).
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # zstd 0.13 via wasmtime-internal-cache: only decompresses wasmtime's own local
  # module cache (self-produced). wasmtime 50 pins zstd 0.13, so the fixed 0.14
  # line cannot be selected without a wasmtime major upgrade (post-RC).
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0395",
  "RUSTSEC-2026-0396",
  "RUSTSEC-2026-0397",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0399",
  "RUSTSEC-2026-0400",
  "RUSTSEC-2026-0401",
  "RUSTSEC-2026-0402",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0404",
  "RUSTSEC-2026-0405",
  "RUSTSEC-2026-0406",
  # keyring/zbus transitive unmaintained (no safe upgrade; local keychain only).
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0372",
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
# Workspace-internal path dependencies are versionless by design (single workspace,
# unpublished crates); banning wildcards produced hundreds of false positives on the
# first real run. Registry dependencies are still covered by advisories/sources/bans.
wildcards = "warn"
deny = [
  # GPL-3.0: incompatible with MIT-only distribution of shipped binaries.
  { crate = "epub", reason = "GPL-3.0; use tool-read-document loaders instead" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
