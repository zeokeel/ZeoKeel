[workspace]
resolver = "2"
members = ["packages/*/*", "crates/*", "apps/desktop", "apps/server", "tools/zk"]
exclude = ["experiments/*", "oem/*", "vendor/*", "fixtures/*"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
semver = "1"
keyring = "4"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
lopdf = "=0.42.0"
toml = "0.8"
anyhow = "1"
thiserror = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "time"] }
tauri = { version = "2.12", features = [] }
tauri-build = "2.7"
wasmtime = "50"
wat = "1.262"
wasmtime-wasi = "50"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
sha2 = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
futures = "0.3"
regex = "1"
rig-core = { version = "0.45", default-features = false, features = ["derive", "reqwest", "rustls", "audio", "image"] }
rig-agent = "0.45"
rig-memory = { version = "0.45", features = ["fs"] }
http = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls", "stream"] }
# Kernel is an external dependency pinned to an exact patch (docs/10 §3).
zeokeel-cordis = "=0.6.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
non_ascii_idents = "deny"
missing_abi = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
