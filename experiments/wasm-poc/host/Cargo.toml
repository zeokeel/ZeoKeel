[package]
name = "zk-wasm-host"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
wasmtime = "50"
wasmtime-wasi = "50"

# CLI-only dep audit triage: build-time seams / derive-only usage that
# cargo-machete cannot see (reviewed for 1.0.0-rc.1).
[package.metadata.cargo-machete]
ignored = ["serde"]
