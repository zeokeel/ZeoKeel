[package]
name = "zk-guest-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]

# CLI-only dep audit triage: build-time seams / derive-only usage that
# cargo-machete cannot see (reviewed for 1.0.0-rc.1).
[package.metadata.cargo-machete]
ignored = ["serde"]
