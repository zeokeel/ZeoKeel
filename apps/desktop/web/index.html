<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZeoKeel 最小 Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        ZeoKeel <span class="brand-sub">最小 Demo</span>
      </div>
      <div class="meta" id="meta">正在读取组合信息…</div>
    </header>

    <main class="chat" id="chat" aria-live="polite">
      <div class="notice" id="notice" hidden></div>
      <p class="hint">
        试试输入：<code>读取 demo-data/hello.txt</code>
      </p>
    </main>

    <footer class="composer">
      <textarea
        id="input"
        rows="2"
        placeholder="输入消息，Enter 发送，Shift+Enter 换行"
        aria-label="消息输入框"
      ></textarea>
      <button id="send" type="button">发送</button>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
